name: Deploy website to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcpgo-next-production
  cancel-in-progress: false

jobs:
  production:
    name: Deploy production
    runs-on: ubuntu-latest
    # Allow initial setup without running a deployment before the project-scoped token is configured.
    if: ${{ vars.VERCEL_AUTO_DEPLOY_ENABLED == 'true' }}
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_Dmfm8M5jVsyucKCosb40qMPd
      VERCEL_PROJECT_ID: prj_OGa9wKDQZx3TQ6li3JGuSAgdcpz3
      VERCEL_TOKEN: ${{ secrets.MCPGO_VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@65.12.1

      - name: Fetch existing project configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
