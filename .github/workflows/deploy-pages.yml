name: Deploy McpGo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: |
          npm run lint
          npm run typecheck
          npm run build
          touch out/.nojekyll
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://mcpgo.ru
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_UMAMI_SHARE_URL: ${{ vars.UMAMI_SHARE_URL }}
          # Main site: mcpgo.ru (repo variable PAGES_CUSTOM_DOMAIN=true).
          # Set false only if switching back to a project path on github.io.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_CUSTOM_DOMAIN == 'true' && '/' || '/mcpgo-next' }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
